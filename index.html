<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Morje Stroški</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e7eb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;background:#f8fafc}.top{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:15px;border-radius:0 0 20px 20px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.7}.event{display:flex;gap:8px;margin-top:12px}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:11px;background:#fff}.event select{flex:1}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.white{background:#fff;color:#111827}.blue{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}main{padding:15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.form,.expense,.admin{background:#fff;border-radius:16px;padding:13px;box-shadow:0 2px 9px #0001}.small{font-size:11px;color:#64748b}.big{font-size:20px;font-weight:850;margin-top:4px}.positive{color:#15803d}.negative{color:#dc2626}.section{margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.head h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:750;color:#475569;margin-bottom:5px}.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person{display:flex;align-items:center;gap:8px;background:#f1f5f9;padding:9px;border-radius:10px;font-weight:650}.person input{width:18px}.expense{margin-bottom:9px}.eh{display:flex;justify-content:space-between;font-weight:750}.meta{font-size:12px;color:#64748b;margin-top:5px}.tag{background:#eef2ff;color:#3730a3;padding:3px 7px;border-radius:8px}.admin{display:none;margin-top:16px}.overlay,.modal{position:fixed;inset:0;z-index:100;background:#0f172add}.overlay{display:flex;align-items:center;justify-content:center;padding:20px}.choose,.sheet{background:#fff;border-radius:22px;padding:18px;width:min(620px,100%)}.choose{max-width:420px}.userbtn{width:100%;border:0;background:#f1f5f9;border-radius:12px;padding:13px;margin-top:8px;font-weight:750}.modal{display:none;align-items:flex-end;justify-content:center;padding:10px;background:#0f172ab8}.modal.show{display:flex}.sheet{max-height:92vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.tabs{display:flex;gap:5px;background:#f1f5f9;padding:4px;border-radius:12px;margin:12px 0}.tab{flex:1;border:0;padding:9px;border-radius:9px;background:transparent;font-weight:750}.tab.active{background:#fff}.personblock{border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:9px}.pl{display:flex;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{background:#f8fafc;border-radius:9px;padding:8px}.stat small{display:block;color:#64748b;font-size:10px}.cat{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f5f9}.settle{background:#f8fafc;border-radius:14px;padding:12px;margin-top:12px}.detail{display:none;border-top:1px solid #e2e8f0;margin-top:8px;padding-top:7px}.detail.show{display:block}.detailrow{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}.detailBtn{margin-top:9px;border:0;background:#eef2ff;color:#3730a3;border-radius:9px;padding:7px;font-weight:700}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="row"><div><div class="title">🌊 Morje Stroški</div><div class="sub" id="userLabel">Izberi uporabnika</div></div><button class="btn white" id="analysisBtn">📊 Analiza</button></div><div class="event"><select id="eventSelect"></select><button class="btn white" id="switchUser">👤</button></div></header><main>
<div class="cards"><div class="card"><div class="small">Skupni stroški</div><div class="big" id="total">0,00 €</div></div><div class="card"><div class="small">Moje plačilo</div><div class="big" id="myPaid">0,00 €</div></div><div class="card"><div class="small">Moj delež</div><div class="big" id="myShare">0,00 €</div></div><div class="card"><div class="small">Moj saldo</div><div class="big" id="myBalance">0,00 €</div></div></div>
<section class="section"><div class="head"><h2>➕ Nov strošek</h2></div><form class="form" id="expenseForm"><div class="grid"><div class="field"><label>Datum</label><input type="date" id="date" required></div><div class="field"><label>Dogodek</label><select id="expenseEvent"></select></div></div><div class="grid"><div class="field"><label>Kategorija</label><select id="category"></select></div><div class="field"><label>Znesek (€)</label><input type="number" id="amount" min=".01" step=".01" required></div></div><div class="field"><label>Opis</label><input id="description" placeholder="npr. kosilo" required></div><div class="field"><label>Plačal</label><select id="paidBy"></select></div><div class="field"><label>Udeleženci – vsi privzeto označeni</label><div class="people" id="participants"></div></div><div class="field"><label>Opomba</label><textarea id="note" rows="2"></textarea></div><button class="btn blue" style="width:100%">Shrani strošek</button></form></section>
<section class="section"><div class="head"><h2>💳 Stroški</h2><span class="sub" id="count"></span></div><div id="expenseList"></div></section><section class="admin" id="adminBox"><h2 style="margin-top:0">⚙️ Administrator</h2><div class="field"><label>Nov dogodek</label><input id="newEvent" placeholder="npr. Morje sep."></div><button class="btn dark" id="createEventBtn">Ustvari dogodek</button></section></main></div>
<div class="overlay" id="userOverlay"><div class="choose"><h1>Kdo si?</h1><p>Izberi uporabnika za osebni delež in saldo.</p><div id="userButtons"></div></div></div><div class="modal" id="analysisModal"><div class="sheet"><div class="sheethead"><h2>📊 Podrobna analiza</h2><button class="close" id="closeAnalysis">×</button></div><div class="tabs"><button class="tab active" id="individualTab">Posamezniki</button><button class="tab" id="couplesTab">Pari</button></div><div id="analysisContent"></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyVjgO8XpaFAbywTBQu7YddQGFB3zLQzyzUJDx6J6oKkZI-aE4hHEOvYofS8SH915bRvg/exec";
const PEOPLE=["Simon","Urška","Alex","Špela"];
const CATEGORIES=["Hrana","Pijača","Trajekt","Gorivo","Nastanitev","Trgovina","Izlet","Drugo"];
const COUPLES=[["Simon","Urška"],["Alex","Špela"]];
let currentUser="", events=[], expenses=[], mode="individual", eventsReady=false;
const el={};
function initEls(){["userLabel","eventSelect","switchUser","analysisBtn","date","expenseEvent","category","amount","description","paidBy","participants","note","expenseForm","total","myPaid","myShare","myBalance","count","expenseList","adminBox","newEvent","createEventBtn","userOverlay","userButtons","analysisModal","closeAnalysis","individualTab","couplesTab","analysisContent"].forEach(id=>el[id]=document.getElementById(id));}
const euro=n=>Number(n||0).toLocaleString("sl-SI",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function api(q){const r=await fetch(API+"?"+new URLSearchParams(q));if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(!d||typeof d!=="object")throw new Error("Neveljaven odgovor strežnika.");return d;}
function form(){el.date.value=new Date().toISOString().slice(0,10);el.category.innerHTML=CATEGORIES.map(x=>`<option>${esc(x)}</option>`).join("");el.paidBy.innerHTML=PEOPLE.map(x=>`<option>${esc(x)}</option>`).join("");setParticipantsAll();}
function setParticipantsAll(){el.participants.innerHTML=PEOPLE.map(x=>`<label class="person"><input type="checkbox" value="${esc(x)}" checked>${esc(x)}</label>`).join("");}
function chooseUser(){el.userButtons.innerHTML=PEOPLE.map(x=>`<button class="userbtn" data-user="${esc(x)}">👤 ${esc(x)}</button>`).join("");el.userButtons.querySelectorAll(".userbtn").forEach(b=>b.onclick=async()=>{currentUser=b.dataset.user;localStorage.setItem("ms_user",currentUser);el.userOverlay.style.display="none";updateUI();if(eventsReady)await loadExpenses();});el.userOverlay.style.display="flex";}
function updateUI(){el.userLabel.textContent="Prijavljen: "+currentUser+(currentUser==="Simon"?" · ADMIN":"");el.adminBox.style.display=currentUser==="Simon"?"block":"none";}
function setupUser(){const saved=localStorage.getItem("ms_user");if(saved&&PEOPLE.includes(saved)){currentUser=saved;el.userOverlay.style.display="none";updateUI();}else chooseUser();}
async function loadEvents(){const d=await api({action:"events"});if(!d.ok)throw new Error(d.error||"Napaka pri dogodkih.");events=Array.isArray(d.events)?d.events.filter(x=>x&&x.name):[];if(!events.length)events=[{id:"default",name:"Morje"}];const saved=localStorage.getItem("ms_event");const selected=events.some(x=>x.name===saved)?saved:events[0].name;el.eventSelect.innerHTML=events.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");el.expenseEvent.innerHTML=el.eventSelect.innerHTML;el.eventSelect.value=selected;el.expenseEvent.value=selected;localStorage.setItem("ms_event",selected);eventsReady=true;}
async function loadExpenses(){if(!currentUser||!eventsReady)return;const event=el.eventSelect.value;if(!event)return;const d=await api({action:"list",event});if(!d.ok)throw new Error(d.error||"Napaka pri branju stroškov.");expenses=Array.isArray(d.expenses)?d.expenses.filter(Boolean):[];renderSummary();renderList();}
function calc(){const b={};PEOPLE.forEach(p=>b[p]={paid:0,share:0,balance:0,cats:{},count:0});for(const e of expenses){const amount=Number(e?.amount)||0;const payer=String(e?.paidBy||"");if(b[payer])b[payer].paid+=amount;let ps=Array.isArray(e?.participants)?e.participants.filter(p=>PEOPLE.includes(p)):[];if(!ps.length)ps=[...PEOPLE];const share=ps.length?amount/ps.length:0;for(const p of ps){if(!b[p])continue;b[p].share+=share;b[p].count++;const c=String(e?.category||"Drugo");b[p].cats[c]=(b[p].cats[c]||0)+share;}}for(const p of PEOPLE){const x=b[p]||{paid:0,share:0,cats:{},count:0};x.balance=x.paid-x.share;b[p]=x;}return b;}
function renderSummary(){const b=calc();const x=b[currentUser]||{paid:0,share:0,balance:0};const total=expenses.reduce((s,e)=>s+(Number(e?.amount)||0),0);el.total.textContent=euro(total);el.myPaid.textContent=euro(x.paid);el.myShare.textContent=euro(x.share);el.myBalance.textContent=(x.balance>=0?"+":"")+euro(x.balance);el.myBalance.className="big "+(x.balance>=0?"positive":"negative");}
function renderList(){el.count.textContent=expenses.length+" zapisov";if(!expenses.length){el.expenseList.innerHTML='<div class="sub" style="padding:25px;text-align:center">Za ta dogodek še ni stroškov.</div>';return;}el.expenseList.innerHTML=expenses.map(e=>{const ps=Array.isArray(e.participants)&&e.participants.length?e.participants:PEOPLE;return `<div class="expense"><div class="eh"><span>${esc(e.description)}</span><b>${euro(e.amount)}</b></div><div class="meta">${esc(e.date)} · ${esc(e.category)} · Plačal: <b>${esc(e.paidBy)}</b></div><div class="meta">Udeleženci: ${esc(ps.join(", "))}${e.note?" · "+esc(e.note):""}</div></div>`;}).join("");}
function settlement(b){const s1=(b.Simon?.balance||0)+(b.Urška?.balance||0),s2=(b.Alex?.balance||0)+(b.Špela?.balance||0),amount=Math.min(Math.abs(s1),Math.abs(s2));let text;if(Math.abs(s1)<.005&&Math.abs(s2)<.005)text="Vsi so poravnani. ✅";else if(s1>.005&&s2<-.005)text=`Alex + Špela → Simon + Urška <b>${euro(amount)}</b>`;else if(s2>.005&&s1<-.005)text=`Simon + Urška → Alex + Špela <b>${euro(amount)}</b>`;else text="Obračun zahteva individualne prenose.";return `<div class="settle"><b>Končni obračun med pari</b><div style="margin-top:7px">${text}</div></div>`;}
function openAnalysis(){if(!eventsReady)return;el.analysisModal.classList.add("show");renderAnalysis();}
function renderAnalysis(){const b=calc();el.individualTab.classList.toggle("active",mode==="individual");el.couplesTab.classList.toggle("active",mode==="couples");if(mode==="couples"){el.analysisContent.innerHTML=COUPLES.map(g=>{const paid=g.reduce((s,p)=>s+(b[p]?.paid||0),0),share=g.reduce((s,p)=>s+(b[p]?.share||0),0),bal=paid-share;return `<div class="personblock"><div class="pl"><b>${g.join(" + ")}</b><b class="${bal>=0?"positive":"negative"}">${bal>=0?"+":""}${euro(bal)}</b></div><div class="stats"><div class="stat"><small>Plačano</small><b>${euro(paid)}</b></div><div class="stat"><small>Delež</small><b>${euro(share)}</b></div><div class="stat"><small>Saldo</small><b>${bal>=0?"+":""}${euro(bal)}</b></div></div></div>`;}).join("")+settlement(b);return;}el.analysisContent.innerHTML=PEOPLE.map(p=>{const x=b[p]||{paid:0,share:0,balance:0,cats:{},count:0};const cats=Object.entries(x.cats||{}).sort((a,z)=>z[1]-a[1]);const rows=expenses.filter(e=>(Array.isArray(e?.participants)&&e.participants.length?e.participants:PEOPLE).includes(p));const id="detail_"+PEOPLE.indexOf(p);return `<div class="personblock"><div class="pl"><b>${p}</b><b class="${x.balance>=0?"positive":"negative"}">${x.balance>=0?"+":""}${euro(x.balance)}</b></div><div class="stats"><div class="stat"><small>Plačano</small><b>${euro(x.paid)}</b></div><div class="stat"><small>Delež</small><b>${euro(x.share)}</b></div><div class="stat"><small>Stroškov</small><b>${x.count}</b></div></div><div style="font-size:12px;font-weight:750;margin-top:9px">Delež po kategorijah</div>${cats.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><b>${euro(v)}</b></div>`).join("")}<button class="detailBtn" data-detail="${id}">Prikaži moje stroške</button><div class="detail" id="${id}">${rows.map(e=>{const ps=Array.isArray(e?.participants)&&e.participants.length?e.participants:PEOPLE;return `<div class="detailrow"><span>${esc(e.date)} · ${esc(e.description)}</span><b>${euro((Number(e.amount)||0)/ps.length)}</b></div>`;}).join("")||"Ni zapisov."}</div></div>`;}).join("")+settlement(b);el.analysisContent.querySelectorAll(".detailBtn").forEach(btn=>btn.onclick=()=>{const d=document.getElementById(btn.dataset.detail);if(d)d.classList.toggle("show");});}

document.addEventListener("DOMContentLoaded",async()=>{initEls();form();setupUser();el.analysisBtn.onclick=openAnalysis;el.closeAnalysis.onclick=()=>el.analysisModal.classList.remove("show");el.analysisModal.onclick=e=>{if(e.target===el.analysisModal)el.analysisModal.classList.remove("show")};el.individualTab.onclick=()=>{mode="individual";renderAnalysis()};el.couplesTab.onclick=()=>{mode="couples";renderAnalysis()};el.switchUser.onclick=chooseUser;el.eventSelect.onchange=async()=>{localStorage.setItem("ms_event",el.eventSelect.value);el.expenseEvent.value=el.eventSelect.value;try{await loadExpenses()}catch(e){alert("Napaka pri branju stroškov: "+e.message)}};el.expenseEvent.onchange=async()=>{el.eventSelect.value=el.expenseEvent.value;localStorage.setItem("ms_event",el.eventSelect.value);try{await loadExpenses()}catch(e){alert("Napaka pri branju stroškov: "+e.message)}};el.expenseForm.onsubmit=async ev=>{ev.preventDefault();const ps=[...el.participants.querySelectorAll("input:checked")].map(x=>x.value);if(!ps.length)return alert("Izberi vsaj enega udeleženca.");try{const d=await api({action:"add",event:el.expenseEvent.value,date:el.date.value,category:el.category.value,description:el.description.value,amount:el.amount.value,paidBy:el.paidBy.value,participants:ps.join("|"),note:el.note.value});if(!d.ok)return alert(d.error||"Napaka pri shranjevanju");el.description.value="";el.amount.value="";el.note.value="";setParticipantsAll();await loadExpenses();}catch(e){alert("Napaka pri shranjevanju: "+e.message)}};el.createEventBtn.onclick=async()=>{const name=el.newEvent.value.trim();if(!name)return alert("Vnesi ime dogodka.");const pin=prompt("Vnesi PIN administratorja:");if(pin===null)return;try{const d=await api({action:"createEvent",name,pin});if(!d.ok)return alert(d.error||"Napaka");el.newEvent.value="";await loadEvents();el.eventSelect.value=name;el.expenseEvent.value=name;localStorage.setItem("ms_event",name);await loadExpenses();alert("Dogodek je ustvarjen.");}catch(e){alert("Napaka pri ustvarjanju dogodka: "+e.message)}};
try{await loadEvents();if(currentUser)await loadExpenses();}catch(e){console.error(e);alert("Napaka povezave z Google Sheets: "+e.message);}});
</script></body></html>
