<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Morje Stroški</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e7eb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;background:#f8fafc}.top{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:15px;border-radius:0 0 20px 20px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.7}.event{display:flex;gap:8px;margin-top:12px}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:11px;background:#fff}.event select{flex:1}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.white{background:#fff;color:#111827}.blue{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}main{padding:15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.form,.expense,.admin{background:#fff;border-radius:16px;padding:13px;box-shadow:0 2px 9px #0001}.small{font-size:11px;color:#64748b}.big{font-size:20px;font-weight:850;margin-top:4px}.positive{color:#15803d}.negative{color:#dc2626}.section{margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.head h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:750;color:#475569;margin-bottom:5px}.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person{display:flex;align-items:center;gap:8px;background:#f1f5f9;padding:9px;border-radius:10px;font-weight:650}.person input{width:18px}.expense{margin-bottom:9px}.eh{display:flex;justify-content:space-between;font-weight:750}.meta{font-size:12px;color:#64748b;margin-top:5px}.tag{background:#eef2ff;color:#3730a3;padding:3px 7px;border-radius:8px}.admin{display:none;margin-top:16px}.overlay,.modal{position:fixed;inset:0;z-index:100;background:#0f172add}.overlay{display:flex;align-items:center;justify-content:center;padding:20px}.choose,.sheet{background:#fff;border-radius:22px;padding:18px;width:min(620px,100%)}.choose{max-width:420px}.userbtn{width:100%;border:0;background:#f1f5f9;border-radius:12px;padding:13px;margin-top:8px;font-weight:750}.modal{display:none;align-items:flex-end;justify-content:center;padding:10px;background:#0f172ab8}.modal.show{display:flex}.sheet{max-height:92vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.tabs{display:flex;gap:5px;background:#f1f5f9;padding:4px;border-radius:12px;margin:12px 0}.tab{flex:1;border:0;padding:9px;border-radius:9px;background:transparent;font-weight:750}.tab.active{background:#fff}.personblock{border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:9px}.pl{display:flex;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{background:#f8fafc;border-radius:9px;padding:8px}.stat small{display:block;color:#64748b;font-size:10px}.cat{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f5f9}.settle{background:#f8fafc;border-radius:14px;padding:12px;margin-top:12px}.detail{display:none;border-top:1px solid #e2e8f0;margin-top:8px;padding-top:7px}.detail.show{display:block}.detailrow{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}.detailBtn{margin-top:9px;border:0;background:#eef2ff;color:#3730a3;border-radius:9px;padding:7px;font-weight:700}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="row"><div><div class="title">🌊 Morje Stroški</div><div class="sub" id="userLabel">Izberi uporabnika</div></div><button class="btn white" id="analysisBtn">📊 Analiza</button></div><div class="event"><select id="eventSelect"></select><button class="btn white" id="switchUser">👤</button></div></header><main>
<div class="cards"><div class="card"><div class="small">Skupni stroški</div><div class="big" id="total">0,00 €</div></div><div class="card"><div class="small">Moje plačilo</div><div class="big" id="myPaid">0,00 €</div></div><div class="card"><div class="small">Moj delež</div><div class="big" id="myShare">0,00 €</div></div><div class="card"><div class="small">Moj saldo</div><div class="big" id="myBalance">0,00 €</div></div></div>
<section class="section"><div class="head"><h2>➕ Nov strošek</h2></div><form class="form" id="expenseForm"><div class="grid"><div class="field"><label>Datum</label><input type="date" id="date" required></div><div class="field"><label>Dogodek</label><select id="expenseEvent"></select></div></div><div class="grid"><div class="field"><label>Kategorija</label><select id="category"></select></div><div class="field"><label>Znesek (€)</label><input type="number" id="amount" min=".01" step=".01" required></div></div><div class="field"><label>Opis</label><input id="description" placeholder="npr. kosilo" required></div><div class="field"><label>Plačal</label><select id="paidBy"></select></div><div class="field"><label>Udeleženci – vsi privzeto označeni</label><div class="people" id="participants"></div></div><div class="field"><label>Opomba</label><textarea id="note" rows="2"></textarea></div><button class="btn blue" style="width:100%">Shrani strošek</button></form></section>
<section class="section"><div class="head"><h2>💳 Stroški</h2><span class="sub" id="count"></span></div><div id="expenseList"></div></section><section class="admin" id="adminBox"><h2 style="margin-top:0">⚙️ Administrator</h2><div class="field"><label>Nov dogodek</label><input id="newEvent" placeholder="npr. Morje sep."></div><button class="btn dark" id="createEventBtn">Ustvari dogodek</button></section></main></div>
<div class="overlay" id="userOverlay"><div class="choose"><h1>Kdo si?</h1><p>Izberi uporabnika za osebni delež in saldo.</p><div id="userButtons"></div></div></div><div class="modal" id="analysisModal"><div class="sheet"><div class="sheethead"><h2>📊 Podrobna analiza</h2><button class="close" id="closeAnalysis">×</button></div><div class="tabs"><button class="tab active" id="individualTab">Posamezniki</button><button class="tab" id="couplesTab">Pari</button></div><div id="analysisContent"></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyVjgO8XpaFAbywTBQu7YddQGFB3zLQzyzUJDx6J6oKkZI-aE4hHEOvYofS8SH915bRvg/exec",P=["Simon","Urška","Alex","Špela"],C=["Hrana","Pijača","Trajekt","Gorivo","Nastanitev","Trgovina","Izlet","Drugo"],CO=[["Simon","Urška"],["Alex","Špela"]];let user="",events=[],expenses=[],mode="individual";const $=x=>document.getElementById(x),eur=n=>Number(n||0).toLocaleString("sl-SI",{minimumFractionDigits:2,maximumFractionDigits:2})+" €",esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));async function api(q){return (await fetch(API+"?"+new URLSearchParams(q))).json()}
function form(){date.value=new Date().toISOString().slice(0,10);category.innerHTML=C.map(x=>`<option>${x}</option>`).join("");paidBy.innerHTML=P.map(x=>`<option>${x}</option>`).join("");participants.innerHTML=P.map(x=>`<label class="person"><input type="checkbox" value="${x}" checked>${x}</label>`).join("")}
function choose(){userButtons.innerHTML=P.map(x=>`<button class="userbtn" data-u="${x}">👤 ${x}</button>`).join("");document.querySelectorAll(".userbtn").forEach(b=>b.onclick=()=>{user=b.dataset.u;localStorage.ms_user=user;userOverlay.style.display="none";ui();load()});userOverlay.style.display="flex"}function ui(){userLabel.textContent="Prijavljen: "+user+(user==="Simon"?" · ADMIN":"");adminBox.style.display=user==="Simon"?"block":"none"}function setup(){let u=localStorage.ms_user;if(P.includes(u)){user=u;userOverlay.style.display="none";ui()}else choose()}
async function loadEvents(){let d=await api({action:"events"});if(!d.ok)throw Error(d.error);events=d.events||[{name:"Morje"}];let s=localStorage.ms_event,ev=events.some(x=>x.name===s)?s:events[0].name;eventSelect.innerHTML=events.map(x=>`<option>${esc(x.name)}</option>`).join("");expenseEvent.innerHTML=eventSelect.innerHTML;eventSelect.value=expenseEvent.value=ev;localStorage.ms_event=ev}async function load(){if(!user)return;let d=await api({action:"list",event:eventSelect.value});if(!d.ok)throw Error(d.error);expenses=d.expenses||[];summary();list()}
function calc(){let b={};P.forEach(x=>b[x]={paid:0,share:0,balance:0,cats:{},count:0});expenses.forEach(e=>{let a=+e.amount||0;if(b[e.paidBy])b[e.paidBy].paid+=a;let ps=e.participants?.length?e.participants:P,s=a/ps.length;ps.forEach(p=>{b[p].share+=s;b[p].count++;b[p].cats[e.category]=(b[p].cats[e.category]||0)+s})});P.forEach(p=>b[p].balance=b[p].paid-b[p].share);return b}function summary(){let b=calc(),x=b[user],t=expenses.reduce((s,e)=>s+(+e.amount||0),0);total.textContent=eur(t);myPaid.textContent=eur(x.paid);myShare.textContent=eur(x.share);myBalance.textContent=(x.balance>=0?"+":"")+eur(x.balance);myBalance.className="big "+(x.balance>=0?"positive":"negative")}function list(){count.textContent=expenses.length+" zapisov";expenseList.innerHTML=expenses.length?expenses.map(e=>`<div class="expense"><div class="eh"><span>${esc(e.description)}</span><b>${eur(e.amount)}</b></div><div class="meta">${esc(e.date)} · ${esc(e.category)} · Plačal: <b>${esc(e.paidBy)}</b></div><div class="meta">Udeleženci: ${esc((e.participants?.length?e.participants:P).join(", "))}${e.note?" · "+esc(e.note):""}</div></div>`).join(""):"<div class=\"sub\" style=\"padding:25px;text-align:center\">Za ta dogodek še ni stroškov.</div>"}
function settlement(b){let a=b.Simon.balance+b.Urška.balance,c=b.Alex.balance+b.Špela.balance,t=Math.min(Math.abs(a),Math.abs(c));let s=Math.abs(a)<.005&&Math.abs(c)<.005?"Vsi so poravnani. ✅":a>0&&c<0?`Alex + Špela → Simon + Urška <b>${eur(t)}</b>`:c>0&&a<0?`Simon + Urška → Alex + Špela <b>${eur(t)}</b>`:"Obračun zahteva individualne prenose.";return `<div class="settle"><b>Končni obračun med pari</b><div style="margin-top:7px">${s}</div></div>`}
function analysis(){let b=calc();individualTab.classList.toggle("active",mode==="individual");couplesTab.classList.toggle("active",mode==="couples");if(mode==="couples"){analysisContent.innerHTML=CO.map(g=>{let paid=g.reduce((s,p)=>s+b[p].paid,0),share=g.reduce((s,p)=>s+b[p].share,0),bal=paid-share;return `<div class="personblock"><div class="pl"><b>${g.join(" + ")}</b><b class="${bal>=0?"positive":"negative"}">${bal>=0?"+":""}${eur(bal)}</b></div><div class="stats"><div class="stat"><small>Plačano</small><b>${eur(paid)}</b></div><div class="stat"><small>Delež</small><b>${eur(share)}</b></div><div class="stat"><small>Saldo</small><b>${eur(bal)}</b></div></div></div>`}).join("")+settlement(b);return}analysisContent.innerHTML=P.map(p=>{let x=b[p],cats=Object.entries(x.cats).sort((a,z)=>z[1]-a[1]),rows=expenses.filter(e=>(e.participants?.length?e.participants:P).includes(p)),id="d"+P.indexOf(p);return `<div class="personblock"><div class="pl"><b>${p}</b><b class="${x.balance>=0?"positive":"negative"}">${x.balance>=0?"+":""}${eur(x.balance)}</b></div><div class="stats"><div class="stat"><small>Plačano</small><b>${eur(x.paid)}</b></div><div class="stat"><small>Delež</small><b>${eur(x.share)}</b></div><div class="stat"><small>Stroškov</small><b>${x.count}</b></div></div><div style="font-size:12px;font-weight:750;margin-top:9px">Delež po kategorijah</div>${cats.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><b>${eur(v)}</b></div>`).join("")}<button class="detailBtn" onclick="$(this.nextElementSibling.id).classList.toggle('show')">Prikaži moje stroške</button><div class="detail" id="${id}">${rows.map(e=>`<div class="detailrow"><span>${esc(e.date)} · ${esc(e.description)}</span><b>${eur((+e.amount||0)/(e.participants?.length?e.participants.length:P.length))}</b></div>`).join("")||"Ni zapisov."}</div></div>`}).join("")+settlement(b)}
analysisBtn.onclick=()=>{analysisModal.classList.add("show");analysis()};closeAnalysis.onclick=()=>analysisModal.classList.remove("show");analysisModal.onclick=e=>{if(e.target===analysisModal)analysisModal.classList.remove("show")};individualTab.onclick=()=>{mode="individual";analysis()};couplesTab.onclick=()=>{mode="couples";analysis()};switchUser.onclick=choose;eventSelect.onchange=()=>{localStorage.ms_event=eventSelect.value;expenseEvent.value=eventSelect.value;load()};expenseEvent.onchange=()=>{eventSelect.value=expenseEvent.value;localStorage.ms_event=eventSelect.value;load()};expenseForm.onsubmit=async e=>{e.preventDefault();let ps=[...document.querySelectorAll("#participants input:checked")].map(x=>x.value);if(!ps.length)return alert("Izberi vsaj enega udeleženca.");let d=await api({action:"add",event:expenseEvent.value,date:date.value,category:category.value,description:description.value,amount:amount.value,paidBy:paidBy.value,participants:ps.join("|"),note:note.value});if(!d.ok)return alert(d.error);description.value=amount.value=note.value="";document.querySelectorAll("#participants input").forEach(x=>x.checked=true);load()};createEventBtn.onclick=async()=>{let n=newEvent.value.trim();if(!n)return alert("Vnesi ime dogodka.");let pin=prompt("Vnesi PIN administratorja:");if(pin===null)return;let d=await api({action:"createEvent",name:n,pin});if(!d.ok)return alert(d.error);newEvent.value="";await loadEvents();eventSelect.value=expenseEvent.value=d.event;localStorage.ms_event=d.event;load();alert("Dogodek je ustvarjen.")};
(async()=>{form();setup();try{await loadEvents();if(user)await load()}catch(e){alert("Napaka povezave z Google Sheets: "+e.message)}})();
</script></body></html>
